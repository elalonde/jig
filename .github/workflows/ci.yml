name: ci

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      # git goes in first, so that checkout makes a real clone.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make openssh-client python3 shellcheck tmux
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The container runs as root over a workspace the runner owns.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: make check
        run: make check
