# One project's settings for one account: ~/.config/jig/<project>.conf
# Read as data, never run. KEY=value, one per line.

# This account's sidecar clone.
REPO=~/ws/src/<project>-dev
# The branch units start from; jig start fast-forwards to origin/<BRANCH>.
BRANCH=master
# The installed version this project runs. Leave it out until that version is
# installed: the dispatcher refuses a pin to a version that is not there.
JIG_VERSION=<version>

# The role accounts. jig start refuses a prompt whose first line names another.
ORCH_ACCOUNT=orchestrator
SPEC_ACCOUNT=specwriter
IMPL_ACCOUNT=implementer
# A spec review runs as the spec writer, a phase-close review as the implementer.
REV_ACCOUNT=specwriter implementer
